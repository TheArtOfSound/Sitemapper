<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;height:100%;width:100%;background:#140f0c;color:#f4ece4;
  font-family:"IBM Plex Sans",system-ui,sans-serif}
body{position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:#140f0c center/cover no-repeat}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,8,6,.4),rgba(8,6,5,.86))}
.card{position:relative;z-index:1;height:100%;display:grid;place-items:center;text-align:center;padding:48px}
.kicker{font:13px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:#7aa68a;margin-bottom:18px}
h1{font:600 56px/1.1 Georgia,"Source Serif 4",serif;margin:0 0 16px;letter-spacing:-.02em}
p{color:#b59a84;margin:0;font:20px/1.4 "IBM Plex Sans",system-ui,sans-serif}
</style>
</head>
<body>
<div class="bg" style="background-image:url('./end-bg.jpg')"></div>
<div class="veil"></div>
<div class="card">
  <div>
    <div class="kicker">Free scan · paid monitoring</div>
    <h1>sitemapper.oortstack.com</h1>
    <p>Know what changed before Google does.</p>
  </div>
</div>
</body>
</html>
