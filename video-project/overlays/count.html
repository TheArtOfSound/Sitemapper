<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
.bar{position:absolute;left:80px;right:80px;bottom:72px;display:flex;gap:18px;align-items:center;justify-content:center}
.chip{background:rgba(17,19,24,.88);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:999px;
  padding:16px 28px;font:600 28px/1 "IBM Plex Sans"}
.chip.bad{background:#e11d48;border-color:#e11d48}
.arrow{color:#fff;font:600 36px/1 "Source Serif 4"}
</style></head>
<body>
<div class="bar">
  <div class="chip">1,361 URLs</div>
  <div class="arrow">→</div>
  <div class="chip bad">0 URLs</div>
</div>
</body></html>
